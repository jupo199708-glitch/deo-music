function connect(wifi, name) {
  if (DEMO) return linked(name || "TV");
  var s = S[st.cur], r = AU.remote, md = navigator.mediaDevices;
  function fail(e) {
    if (e && (e.name === "NotFoundError" || e.name === "NotAllowedError" || e.name === "AbortError")) return toast("No se eligió ningún dispositivo.");
    toast("Este navegador no puede conectar aquí. Conecta el equipo por Bluetooth en Ajustes del teléfono y el sonido saldrá ahí.");
  }
  if (wifi) {
    if (r && r.prompt) {
      if (!s || !s.url || s.local) return toast("Para emitir por Wi-Fi elige una canción del catálogo online.");
      return r.prompt().then(function () { linked(name || "Dispositivo"); }).catch(fail);
    }
    if (AU.webkitShowPlaybackTargetPicker) { AU.webkitShowPlaybackTargetPicker(); return; }
  }
  if (md && md.selectAudioOutput) return md.selectAudioOutput().then(function (d) { if (AU.setSinkId) AU.setSinkId(d.deviceId); linked(d.label || name || "Bluetooth"); }).catch(fail);

    else { $("sheet").classList.remove("open"); toast("Conecta el equipo por Bluetooth en Ajustes del teléfono y el sonido saldrá ahí."); }
  } else if (e.target === $("sheet")) $("sheet").classList.remove("open");

  }, { passive: true });
}
if (st.shakeOn) startShakeSensor();
