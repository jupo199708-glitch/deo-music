<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<title>DEO Music</title>
<style>
:root{color-scheme:dark;--fg:#f5f2ee;--mut:rgba(245,242,238,.62);--glass:rgba(255,255,255,.13);--line:rgba(255,255,255,.28);--h:30;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"Helvetica Neue",Arial,sans-serif;color:var(--fg);background:hsl(var(--h),45%,22%);overflow:hidden;transition:background .8s}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(70% 45% at 25% 15%,hsla(var(--h),90%,65%,.55),transparent),radial-gradient(80% 50% at 85% 95%,hsla(calc(var(--h) - 25),90%,30%,.9),transparent);transition:.8s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--fg);background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;outline:none}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
select option{color:#111}
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:12px 18px 16px}
.top{display:flex;gap:10px;align-items:center}
.top input{flex:1;border-radius:999px;padding:10px 16px}
.ib{width:42px;height:42px;border-radius:50%;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ib svg,.ctl svg{width:22px;height:22px;fill:currentColor}
.plname{margin:14px 4px 0;font-size:13px;color:var(--mut)}
.stage{flex:1;min-height:300px;position:relative;perspective:900px;touch-action:pan-y;user-select:none}
.card{position:absolute;left:50%;top:50%;width:min(58vw,250px);aspect-ratio:3/4.1;margin:calc(min(58vw,250px)*-.82) 0 0 calc(min(58vw,250px)*-.5);border-radius:22px;padding:9px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s;box-shadow:0 20px 40px rgba(0,0,0,.3);cursor:pointer}
.art{width:100%;aspect-ratio:1;border-radius:15px;display:grid;place-items:center;font-size:52px;font-weight:700;color:rgba(255,255,255,.9);overflow:hidden}
.card h3{margin:10px 4px 2px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{margin:0 4px;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:14px;padding:20px}
.empty p{margin:0;color:var(--mut)}
.pill{background:var(--fg);color:#222;border-radius:999px;padding:12px 22px;font-weight:600}
.mini{display:flex;align-items:center;gap:12px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 16px 8px 8px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.mini .art{width:44px;border-radius:10px;font-size:18px;flex:none}
.mi{flex:1;min-width:0}.mi b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mi span{font-size:12px;color:var(--mut)}
.bar{margin:14px 6px 0;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--mut)}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;padding:0;border:0;border-radius:4px;background:rgba(255,255,255,.28)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--fg)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--fg)}
.ctls{display:flex;align-items:center;justify-content:space-between;margin:12px 4px 0}
.ctl{width:46px;height:46px;display:grid;place-items:center;border-radius:50%;opacity:.85}
.ctl.on{color:#5dffa0;opacity:1}
.ctl.big{width:66px;height:66px;opacity:1}.ctl.big svg{width:44px;height:44px}
.vol{display:flex;align-items:center;gap:10px;margin:8px 8px 0}.vol svg{width:18px;height:18px;fill:var(--mut);flex:none}
.sheet{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
.sheet.open{display:flex}
.panel{width:100%;max-width:520px;margin:0 auto;max-height:82%;overflow:auto;background:hsl(var(--h),30%,16%);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 12px;font-size:20px}.panel h4{margin:18px 0 8px;font-size:14px;color:var(--mut)}
.row{display:flex;gap:8px;margin-bottom:8px}.row .pill{flex:none;padding:10px 16px}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item.sel{color:#5dffa0}.item small{color:var(--mut)}
.auth{height:100%;display:grid;place-content:center;gap:12px;max-width:380px;margin:0 auto;padding:24px;text-align:center}
.auth h1{margin:0;font-size:34px;letter-spacing:-.5px}.auth p{margin:0;color:var(--mut);line-height:1.4}
.code{background:var(--glass);border:1px dashed var(--line);border-radius:14px;padding:10px;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:#222;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:9;max-width:90%;text-align:center}
#toast.show{opacity:1}
.hid{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

:root{--g:#7ddc2a}
body.dark{background:#000}body.dark::before{display:none}
.logo{width:min(72vw,300px);margin:0 auto 4px;mix-blend-mode:lighten;display:block}
.auth .pill{background:var(--g);color:#06140a}
.tabs{display:flex;gap:6px;background:var(--glass);border-radius:999px;padding:4px}
.tabs button{flex:1;padding:9px;border-radius:999px;font-size:14px;color:var(--mut)}.tabs button.on{background:var(--g);color:#06140a;font-weight:600}
.or{font-size:12px;color:var(--mut);margin-top:6px}
.soc{display:flex;gap:8px}.soc button{flex:1;padding:11px 4px;border:1px solid var(--line);border-radius:14px;font-size:13px;background:var(--glass)}
.ph{width:120px;height:120px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--glass);border:2px dashed var(--g);cursor:pointer;overflow:hidden;color:var(--g);font-weight:600}
.ph img{width:100%;height:100%;object-fit:cover}
.av{width:46px;height:46px;border-radius:50%;overflow:hidden;background:var(--g);color:#06140a;font-weight:700;display:grid;place-items:center;flex:none;font-size:18px}.av img{width:100%;height:100%;object-fit:cover}
.home h2{margin:22px 4px 12px;font-size:24px}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start;padding-bottom:12px}
.pl{text-align:left;background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:9px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.pl .art{font-size:40px;margin-bottom:8px}.pl b{display:block;font-size:14px;margin:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl small{margin:0 3px;font-size:12px;color:var(--mut)}
</style></head><body>

<script>
const $=s=>document.querySelector(s),au=$('#au');
const PLAY='<path d="M7 4v16l14-8z"/>',PAUSE='<path d="M6 4h4v16H6zm8 0h4v16h-4z"/>';
let user=null,S={tracks:[],lists:[],name:''},list='all',idx=0,shuffle=false,repeat=false,query='',urls={},code='';
const sb=supabase.createClient('https://ozwwcwvzrfzpzcunbihe.supabase.co','sb_publishable_TBYA-gLvmPS1LFkiclQ3ug_KSOuKLaF');
const save=async()=>{const {error}=await sb.from('profiles').upsert({id:user,name:S.name,photo:S.photo});if(error)toast('No se pudo guardar el perfil')};
async function newList(v){const {data,error}=await sb.from('playlists').insert({name:v}).select().single();if(error){toast('No se pudo crear la playlist');return}S.lists.push({id:data.id,name:v,ids:[]})}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('show'),2600)}
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const hue=t=>[...t.id].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;
const artStyle=t=>`background:linear-gradient(135deg,hsl(${hue(t)},70%,55%),hsl(${(hue(t)+60)%360},65%,25%))`;
const ini=t=>(t.title||'?').trim().slice(0,1).toUpperCase();

/* Acceso */
let booted=false;
function view(v){['auth','prof','home','app'].forEach(x=>$('#'+x).classList.toggle('hid',x!==v));document.body.classList.toggle('dark',v==='auth');if(v!=='app')document.documentElement.style.setProperty('--h',105)}
$('#aBtn').onclick=async()=>{
  const em=$('#email').value.trim().toLowerCase();
  if(!/^\S+@\S+\.\S+$/.test(em)){toast('Escribe un correo válido');return}
  $('#aBtn').disabled=true;
  const {error}=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+location.pathname}});
  $('#aBtn').disabled=false;
  if(error){toast(/rate|seconds/i.test(error.message)?'Espera un momento antes de pedir otro enlace':'No se pudo enviar: '+error.message);return}
  $('#aMsg').textContent='Te enviamos un enlace a '+em+'. Ábrelo en este mismo teléfono para entrar.';$('#aBtn').textContent='Reenviar enlace';
};
async function boot(u){
  if(booted)return;booted=true;user=u.id;S={tracks:[],lists:[],name:'',photo:''};
  const [p,t,l,pt]=await Promise.all([sb.from('profiles').select('name,photo').eq('id',user).maybeSingle(),sb.from('tracks').select('id,title,artist,path'),sb.from('playlists').select('id,name'),sb.from('playlist_tracks').select('playlist_id,track_id')]);
  if(p.data){S.name=p.data.name||'';S.photo=p.data.photo||''}
  S.tracks=t.data||[];
  S.lists=(l.data||[]).map(x=>({id:x.id,name:x.name,ids:(pt.data||[]).filter(y=>y.playlist_id===x.id).map(y=>y.track_id)}));
  if(!S.name)editProf();else home();
}
function editProf(){view('prof');$('#pname').value=S.name||'';const i=$('#phImg');i.classList.toggle('hid',!S.photo);$('#phTxt').classList.toggle('hid',!!S.photo);if(S.photo)i.src=S.photo}
$('#pf').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=240;const x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,240,240);S.photo=c.toDataURL('image/jpeg',.8);editProf()};im.src=URL.createObjectURL(f)};
$('#pBtn').onclick=()=>{const n=$('#pname').value.trim();if(!n){toast('Escribe tu nombre');return}S.name=n;save();home()};
function home(){
  view('home');$('#hi').textContent='Hola, '+S.name;
  const av=$('#av');av.textContent='';if(S.photo){const i=document.createElement('img');i.src=S.photo;i.alt='';av.appendChild(i)}else av.textContent=S.name[0].toUpperCase();
  const L=[{id:'all',name:'Toda mi música',ids:S.tracks.map(t=>t.id)},...S.lists],g=$('#grid');
  g.innerHTML=L.map(l=>{const t=S.tracks.find(x=>x.id===l.ids[0]);return `<button class="pl"><div class="art" style="${t?artStyle(t):'background:var(--glass)'}">${t?ini(t):'♪'}</div><b></b><small>${l.ids.length} canciones</small></button>`}).join('');
  g.querySelectorAll('.pl').forEach((b,i)=>{b.querySelector('b').textContent=L[i].name;b.onclick=()=>{list=L[i].id;idx=0;query='';$('#q').value='';view('app');render()}});
}
$('#av').onclick=editProf;$('#outBtn').onclick=()=>{au.pause();sb.auth.signOut().then(()=>location.reload())};$('#backBtn').onclick=()=>home();
$('#addH').onclick=async()=>{const v=$('#np2').value.trim();if(!v)return;await newList(v);$('#np2').value='';home()};
au.volume=.8;

/* Lista actual */
const all=()=>S.tracks;
const cur=()=>{let a=list==='all'?all():(S.lists.find(l=>l.id===list)?.ids||[]).map(i=>S.tracks.find(t=>t.id===i)).filter(Boolean);
  if(query)a=a.filter(t=>(t.title+' '+t.artist).toLowerCase().includes(query));return a};
$('#q').oninput=e=>{query=e.target.value.toLowerCase();idx=0;render()};

/* Render */
function render(){
  const a=cur(),st=$('#stage');idx=Math.min(idx,Math.max(a.length-1,0));
  $('#plname').textContent=(list==='all'?'Toda mi música':S.lists.find(l=>l.id===list)?.name)+' · '+a.length+' canciones';
  if(!a.length){st.innerHTML='<div class="empty"><p>'+(query?'Sin resultados en tu biblioteca.':'Tu biblioteca está vacía.<br>Sube archivos de audio para crear tu colección.')+'</p><button class="pill" id="e1" style="justify-self:center">Subir música</button></div>';$('#e1').onclick=()=>$('#file').click();info(null);return}
  st.innerHTML=a.map((t,i)=>`<div class="card" data-i="${i}"><div class="art" style="${artStyle(t)}">${ini(t)}</div><h3></h3><p></p></div>`).join('');
  st.querySelectorAll('.card').forEach((c,i)=>{c.querySelector('h3').textContent=a[i].title;c.querySelector('p').textContent=a[i].artist});
  place();info(a[idx]);
}
function place(){
  document.querySelectorAll('.card').forEach(c=>{const o=+c.dataset.i-idx,ab=Math.abs(o);
    c.style.transform=`translateX(${o*(window.innerWidth<420?24:34)*(ab>0?1:0)+o*Math.min(innerWidth*.2,70)}px) translateZ(${-ab*90}px) rotateY(${-o*28}deg) scale(${1-Math.min(ab,3)*.04})`;
    c.style.zIndex=10-ab;c.style.opacity=ab>3?0:1-ab*.18;c.style.pointerEvents=ab>3?'none':'auto'});
}
function info(t){
  document.documentElement.style.setProperty('--h',t?hue(t):30);
  $('#mT').textContent=t?t.title:'Sin canción';$('#mA').textContent=t?t.artist:'Sube música para empezar';
  const m=$('#mArt');m.style.cssText=t?artStyle(t):'background:var(--glass)';m.textContent=t?ini(t):'';
}
let sx=null,moved=false;
const stage=$('#stage');
stage.addEventListener('pointerdown',e=>{sx=e.clientX;moved=false});
stage.addEventListener('pointerup',e=>{if(sx===null)return;const d=e.clientX-sx;sx=null;
  if(Math.abs(d)>40){moved=true;go(d<0?1:-1,false)}
  else{const c=e.target.closest('.card');if(c){const i=+c.dataset.i;if(i===idx)toggle();else{idx=i;place();info(cur()[idx]);start()}}}});
function go(n,auto){const a=cur();if(!a.length)return;idx=(idx+n+a.length)%a.length;place();info(a[idx]);start()}

/* Reproducción */
async function start(){
  const t=cur()[idx];if(!t)return;
  if(!urls[t.id]){const {data,error}=await sb.storage.from('music').createSignedUrl(t.path,7200);if(error){toast('No se pudo cargar la canción');return}urls[t.id]=data.signedUrl}
  if(au.dataset.id!==t.id){au.src=urls[t.id];au.dataset.id=t.id}
  try{await au.play()}catch(e){}
  setMedia(t);
}
function setMedia(t){if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist});
  navigator.mediaSession.setActionHandler('nexttrack',()=>next());navigator.mediaSession.setActionHandler('previoustrack',()=>go(-1));
  navigator.mediaSession.setActionHandler('play',()=>au.play());navigator.mediaSession.setActionHandler('pause',()=>au.pause())}}
function toggle(){const t=cur()[idx];if(!t)return;if(au.dataset.id!==t.id)start();else au.paused?au.play():au.pause()}
function next(){const a=cur();if(!a.length)return;if(shuffle&&a.length>1){let n;do n=Math.floor(Math.random()*a.length);while(n===idx);idx=n;place();info(a[idx]);start()}else go(1)}
$('#play').onclick=toggle;$('#next').onclick=next;$('#prev').onclick=()=>go(-1);
$('#shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.classList.toggle('on',shuffle);toast(shuffle?'Aleatorio activado':'Aleatorio desactivado')};
$('#rep').onclick=e=>{repeat=!repeat;e.currentTarget.classList.toggle('on',repeat);toast(repeat?'Repetir canción':'Repetir desactivado')};
au.onended=()=>repeat?(au.currentTime=0,au.play()):next();
au.onplay=au.onpause=()=>$('#pIcon').innerHTML=au.paused?PLAY:PAUSE;
au.ontimeupdate=()=>{$('#cur').textContent=fmt(au.currentTime);$('#dur').textContent=fmt(au.duration);if(au.duration)$('#seek').value=au.currentTime/au.duration*1000};
$('#seek').oninput=e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration};
$('#vol').oninput=e=>au.volume=e.target.value/100;
$('#pIcon').innerHTML=PLAY;

/* Subir música */
$('#upBtn').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const fs=[...e.target.files];let n=0;toast('Subiendo '+fs.length+' archivo(s)...');
  for(const f of fs){
    const name=f.name.replace(/\.[^.]+$/,''),p=name.split(' - '),path=user+'/'+Date.now()+'_'+f.name.replace(/[^\w.\-]+/g,'_');
    const up=await sb.storage.from('music').upload(path,f,{contentType:f.type||'audio/mpeg'});
    if(up.error){toast('Error al subir: '+up.error.message);continue}
    const {data,error}=await sb.from('tracks').insert({title:(p[1]||name).trim(),artist:p[1]?p[0].trim():'Mi música',path}).select('id,title,artist,path').single();
    if(!error){S.tracks.push(data);n++}
  }
  e.target.value='';render();toast(n+' canción(es) añadidas');
};

/* Cast / Bluetooth / Alexa */
$('#castBtn').onclick=async()=>{
  try{if(au.remote&&au.remote.prompt){await au.remote.prompt();return}}catch(e){if(e&&e.name==='NotAllowedError')return}
  try{if(au.setSinkId&&navigator.mediaDevices?.selectAudioOutput){const d=await navigator.mediaDevices.selectAudioOutput();await au.setSinkId(d.deviceId);toast('Salida: '+d.label);return}}catch(e){}
  toast('Empareja tu bocina o Alexa por Bluetooth en Ajustes del teléfono; el audio saldrá por ella.');
};

/* Panel: perfil y playlists */
$('#menuBtn').onclick=openPanel;
$('#sheet').onclick=e=>{if(e.target.id==='sheet')$('#sheet').classList.remove('open')};
function openPanel(){
  const p=$('#panel');
  p.innerHTML=`<h2>Mi perfil</h2><div class="row"><input id="nm" placeholder="Tu nombre"></div><small style="color:var(--mut)" id="em"></small>
  <h4>Mis playlists</h4>
  <button class="item ${list==='all'?'sel':''}" data-l="all">Toda mi música <small>${S.tracks.length}</small></button>
  ${S.lists.map(l=>`<button class="item ${list===l.id?'sel':''}" data-l="${l.id}"><span class="ln"></span><small>${l.ids.length}</small></button>`).join('')}
  <div class="row" style="margin-top:12px"><input id="np" placeholder="Nueva playlist"><button class="pill" id="addL">Crear</button></div>
  <h4>Añadir la canción actual a una playlist</h4>
  <div class="row"><select id="sel">${S.lists.map(l=>`<option value="${l.id}"></option>`).join('')||'<option value="">Crea una playlist primero</option>'}</select><button class="pill" id="addT">Añadir</button></div>
  <h4>Cuenta</h4><button class="item" id="out">Cerrar sesión</button>`;
  $('#nm').value=S.name;$('#em').textContent=user;
  p.querySelectorAll('.ln').forEach((x,i)=>x.textContent=S.lists[i].name);
  p.querySelectorAll('#sel option').forEach((o,i)=>{if(S.lists[i])o.textContent=S.lists[i].name});
  $('#nm').onchange=e=>{S.name=e.target.value;save();toast('Perfil guardado')};
  p.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{list=b.dataset.l;idx=0;$('#sheet').classList.remove('open');render()});
  $('#addL').onclick=async()=>{const v=$('#np').value.trim();if(!v)return;await newList(v);openPanel()};
  $('#addT').onclick=async()=>{const t=cur()[idx],l=S.lists.find(x=>x.id===$('#sel').value);if(!t||!l){toast('Elige una canción y una playlist');return}
    if(!l.ids.includes(t.id)){l.ids.push(t.id);await sb.from('playlist_tracks').insert({playlist_id:l.id,track_id:t.id})}toast('Añadida a '+l.name);openPanel()};
  $('#out').onclick=()=>{au.pause();sb.auth.signOut().then(()=>location.reload())};
  $('#sheet').classList.add('open');
}
window.addEventListener('resize',place);
sb.auth.onAuthStateChange((ev,s)=>{if(s&&s.user)boot(s.user)});
sb.auth.getSession().then(({data})=>{if(data.session)boot(data.session.user)});
</script></body></html>
