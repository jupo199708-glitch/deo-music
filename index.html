<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi música</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
:root{--bg:#050508;--glass:rgba(255,255,255,.04);--glass2:rgba(255,255,255,.09);--line:rgba(255,255,255,.08);--text:#fff;--muted:rgba(255,255,255,.55);--btn:rgba(255,255,255,.1);--btn-text:rgba(255,255,255,.9);--fill:#fff;--tr:rgba(255,255,255,.2);--pn:rgba(10,10,16,.55);--glow:rgba(0,0,0,.35);--tc:rgb(70,110,230);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f8ff;--glass:rgba(255,255,255,.4);--glass2:rgba(7,9,15,.06);--line:rgba(7,9,15,.09);--text:#07090f;--muted:rgba(7,9,15,.55);--btn:rgba(7,9,15,.07);--btn-text:rgba(7,9,15,.85);--fill:#07090f;--tr:rgba(7,9,15,.15);--pn:rgba(246,248,255,.6);--glow:rgba(0,0,0,.15)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;position:relative}
body::before,body::after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,var(--tc),transparent 68%);opacity:.3}
body::before{width:560px;height:560px;top:-240px;right:-260px}
body::after{width:480px;height:480px;bottom:20px;left:-250px;opacity:.2}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,.av:focus-within{outline:2px solid var(--muted);outline-offset:2px}
.i{width:22px;height:22px;flex:none}
#main{flex:1;min-height:0;overflow-y:auto;padding:22px 18px 16px;position:relative;z-index:1}
.pv{display:flex;flex-direction:column;min-height:100%}
.prof{display:flex;flex-direction:column;align-items:center;margin-bottom:26px}
.av{position:relative;width:116px;height:116px;border-radius:50%;cursor:pointer;box-shadow:0 10px 40px var(--glow)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--line);background:#fbfbf9}
.cam{position:absolute;right:0;bottom:2px;width:32px;height:32px;border-radius:50%;background:var(--btn);color:var(--btn-text);display:grid;place-items:center}
.cam .i{width:16px;height:16px}
.nm{margin-top:14px;width:100%;max-width:280px;text-align:center;font:inherit;font-size:22px;font-weight:700;color:var(--text);background:none;border:0;border-bottom:1px dashed transparent;padding:4px}
.nm:focus{border-bottom-color:var(--line);outline:0}
h2{font-size:19px;margin:0 0 12px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.top h2{margin:0;flex:1}
.ib{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px;border-radius:18px;background:var(--glass);border:1px solid var(--line);cursor:pointer}
.row.on{background:var(--glass2)}
.rt{flex:1;min-width:0;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.cov{display:grid;place-items:center;flex:none;border-radius:14px;color:rgba(255,255,255,.85);background:linear-gradient(135deg,hsl(var(--h) 72% 52%),hsl(calc(var(--h) + 50) 72% 24%))}
.c64{width:64px;height:64px}.c48{width:48px;height:48px;border-radius:12px}.c44{width:44px;height:44px;border-radius:12px}
.chev{color:var(--muted);margin-right:4px}
.sb{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);margin-bottom:16px}
.sb input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--text);background:none;border:0;outline:0}
.sb input::placeholder{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:15px}
.dock{position:relative;z-index:2;background:linear-gradient(transparent,var(--bg) 38%);padding:18px 16px 8px}
.np{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.np .rt{font-size:15px}
.cast{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--glass);border:1px solid var(--line)}
.cast .i{width:18px;height:18px}
.cast.on{background:var(--btn);color:var(--btn-text)}
.seek{display:flex;align-items:center;gap:10px;margin:8px 0 2px;font-size:12px;color:var(--text);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;height:22px;margin:0;background:none;-webkit-appearance:none;appearance:none;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--fill) var(--p),var(--tr) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--fill);margin-top:-5px}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--tr)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--fill)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--fill)}
.ctl{display:flex;justify-content:center;align-items:center;gap:22px;margin:2px 0 6px;color:var(--btn-text)}
.ctl .i{width:26px;height:26px}
.pp{width:54px;height:54px;border-radius:50%;background:var(--btn);color:var(--btn-text);display:grid;place-items:center;border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav{display:flex;margin:6px 0 0;padding:0 2px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px}
.nav button[aria-current="page"]{color:var(--text);background:var(--glass2);border-radius:14px}
.sheet{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.35);display:none;align-items:flex-end}
.sheet.open{display:flex}
.panel{width:100%;background:var(--pn);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 4px}.panel p{margin:0 0 14px;color:var(--muted);font-size:13px}
.dev{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:14px;margin-bottom:8px;background:var(--glass);border:1px solid var(--line);text-align:left;font-size:15px}
.dev small{color:var(--muted)}.dev.on{background:var(--btn);color:var(--btn-text)}.dev.on small{color:inherit;opacity:.7}
.dev .rt{flex:1}
.dev.go{justify-content:center;background:var(--btn);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(250px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;background:var(--pn);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--text);border:1px solid var(--line);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
.toast.show{opacity:1}
.pk{max-height:46vh;overflow-y:auto;margin-bottom:6px}
.full{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px));background:linear-gradient(155deg,color-mix(in srgb,var(--tc) 78%,#09090d),color-mix(in srgb,var(--tc) 32%,#050508) 58%,#050508);transform:translateY(100%);visibility:hidden;will-change:transform;transition:transform .42s cubic-bezier(.32,.72,0,1),visibility .42s}
.full::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(155deg,color-mix(in srgb,var(--tc) 26%,transparent),transparent 72%);opacity:1}
.full.open{transform:none;visibility:visible}
.cbig{width:100%;height:100%;border-radius:28px;box-shadow:0 14px 36px var(--glow)}
.cbig .i{width:30%;height:30%}
.hint{margin:-6px 0 14px;font-size:13px;color:var(--muted)}
#fcov{position:relative;width:calc(100% + 44px);height:calc(var(--s) + 48px);--s:min(54vw,250px,32dvh);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.car-in{position:absolute;inset:0}
.cs{position:absolute;top:24px;left:calc(50% - var(--s) / 2);width:var(--s);height:var(--s);will-change:transform,opacity}
.sin{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.upbig{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:30px 16px;border:1px dashed var(--line);border-radius:22px;background:var(--glass);cursor:pointer;margin-bottom:18px}
.upbig .i{width:34px;height:34px}.upbig b{font-size:17px}.upbig small{color:var(--muted);font-size:13px}
.hidden{display:none}
.gate{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);overflow-y:auto}
.gate.hidden{display:none}
.gcard{width:100%;max-width:380px;background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:28px 22px;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.glogo{width:96px;height:96px;border-radius:26px;overflow:hidden;margin:0 auto 14px;background:#fbfbf9;box-shadow:0 10px 40px var(--glow)}
.glogo img{width:100%;height:100%;object-fit:cover}
.gcard h1{font-size:23px;text-align:center;margin:0 0 4px}
.gs{text-align:center;color:var(--muted);font-size:14px;margin:0 0 18px}
.gtabs{display:flex;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.gtabs button{flex:1;padding:10px;border-radius:10px;font-size:14px;color:var(--muted);border:1px solid transparent}
.gtabs button[aria-selected="true"]{background:var(--btn);color:var(--btn-text);border-color:var(--line)}
.gcard label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
.gcard .sin{margin-bottom:0}
.gbtn{width:100%;margin-top:18px;padding:14px;border-radius:14px;background:var(--btn);color:var(--btn-text);border:1px solid var(--line);font-size:16px;font-weight:600}
.gbtn:disabled{opacity:.6}
.pv .gbtn{margin-top:auto}
.gmsg{min-height:20px;margin:12px 0 0;font-size:14px;text-align:center}.gmsg.err{color:#ff8b98}.gmsg.ok{color:#6ee7b7}
.dst{display:flex;gap:8px;margin-bottom:10px}.dst .dev{margin:0;justify-content:center}
@media (prefers-reduced-motion: reduce){.toast,.trk i,.full,.full::before,body::before,body::after{transition:none}}

:root{--ac:#fff;--on:#111;--co:hsl(0 0% 26% / .78);--co2:hsl(30 60% 21%)}
#fbg{display:none}
.fh{display:grid;grid-template-columns:44px 1fr auto;align-items:center;width:100%;font-size:19px;font-weight:500;color:var(--text)}
.fh>span:nth-child(2){text-align:center}.fh .g{display:flex;gap:2px}.fh .ib{background:none;border:0;width:44px}
.mid{flex:1;min-height:0;width:100%;position:relative;display:grid;place-items:center}
#fly{position:absolute;inset:0;overflow-y:auto;padding:90px 2px;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent)}
#fly::-webkit-scrollbar{display:none}
.ln{margin:0 0 20px;font-size:27px;line-height:1.3;font-weight:700;opacity:.32;transition:opacity .3s}
.ln.cur{opacity:1}#fly.plain .ln{font-size:20px;opacity:.9;margin-bottom:12px}
.ft{width:100%;margin:8px 0 2px}
.ft span{display:block;font-size:30px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft small{display:block;margin-top:4px;font-size:18px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wvw{position:relative;width:100%;height:40px;margin-top:6px}.mw{display:none}
.full{touch-action:none}#fly{touch-action:pan-y}.full.drag{transition:none}
html,button{touch-action:manipulation}
button,.row{transition:transform .12s}
button:active{transform:scale(.95)}
.row:active{transform:scale(.985)}
@keyframes sup{from{transform:translateY(100%)}to{transform:none}}
@keyframes sfd{from{opacity:0}to{opacity:1}}
.sheet.open{animation:sfd .22s ease-out}
.sheet.open .panel{animation:sup .34s cubic-bezier(.32,.72,0,1)}
.wvw canvas,.mw canvas{position:absolute;inset:0;width:100%;height:100%}
.wvw input,.mw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.tm{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}
.fi{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:20px;background:rgba(0,0,0,.28);font-size:14px}.fi .i{width:16px;height:16px}.fi:empty{visibility:hidden}
.pc{display:grid;grid-template-columns:1fr 1.55fr 1fr;gap:10px;width:100%;margin:20px 0 12px}
.pb{height:72px;border-radius:36px;background:var(--co);color:var(--text);display:grid;place-items:center}
.pb.pl{background:var(--ac);color:var(--on)}.pb .i{width:30px;height:30px}
.vol{display:flex;align-items:center;gap:12px;width:100%;margin:4px 0 12px;color:var(--muted)}.vol.hidden{display:none}
.vol input{--fill:var(--ac)}.vol input[type=range]::-webkit-slider-thumb{width:5px;height:24px;border-radius:3px;margin-top:-10px;background:var(--ac)}
.bot{display:flex;justify-content:space-between;align-items:center;width:100%}
.bb{width:76px;height:56px;border-radius:20px;background:var(--co);color:var(--text);display:grid;place-items:center}.bb .i{width:26px;height:26px}
.bb.act,.bb.on{background:var(--co2);color:var(--ac)}
.pair{display:flex;gap:3px}.pair .bb{width:78px}.pair .bb:first-child{border-radius:28px 6px 6px 28px}.pair .bb:last-child{border-radius:6px 28px 28px 6px}
#dcov .cov{width:54px;height:54px;border-radius:14px}.np .rt{font-size:17px}
.sm{width:56px;height:56px;border-radius:18px;background:var(--ac);color:var(--on);display:grid;place-items:center;flex:none}.sm .i{width:26px;height:26px}
.ib2{width:40px;height:40px;display:grid;place-items:center;color:var(--text);flex:none}
.panel{background:color-mix(in srgb,var(--tc) 20%,rgba(14,14,18,.85))}
.panel::before{content:"";display:block;width:44px;height:4px;border-radius:2px;background:var(--muted);opacity:.6;margin:-6px auto 14px}
.mrow{display:flex;align-items:center;gap:16px;width:100%;padding:15px 16px;border-radius:18px;background:rgba(255,255,255,.06);margin-bottom:4px;font-size:16px;text-align:left}
.mrow.on{background:var(--btn)}.mrow span{flex:1;min-width:0}.mrow .i{width:24px;height:24px;flex:none}.mrow small{display:block;margin-top:2px;color:var(--muted);font-size:14px}
.rt small.oc,.ft small.oc{display:flex;align-items:center;gap:5px;margin-top:3px;font-size:12px;color:var(--muted);font-weight:400}
.ft small.oc{margin-top:6px;font-size:13px}
.oc .i{width:14px;height:14px;flex:none}.oc span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.oc:empty{display:none!important}
.mrow.bsy{opacity:.65;pointer-events:none}.sp{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--text);border-radius:50%;animation:spn .8s linear infinite;flex:none}
@keyframes spn{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sp{animation-duration:2s}}
.dev.hid{display:none}
.pcount{margin:0 0 10px;font-size:13px;color:var(--muted)}
.rm{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--muted);background:var(--glass2)}
.rm .i{width:18px;height:18px}

/* ===== v2: reproductor transparente, carrusel con sombras, botones finos ===== */
@property --tz{syntax:"<color>";inherits:true;initial-value:#3a4a8a}
:root{--tz:#3a4a8a;transition:--tz .8s ease}
.full{--text:#fff;--muted:rgba(255,255,255,.6);background:rgba(6,6,10,.94)}
.full::before{display:none}
#ftint{position:absolute;inset:-6px -22px;z-index:0;pointer-events:none;background:radial-gradient(ellipse 85% 58% at 50% 48%,color-mix(in srgb,var(--tz) 78%,transparent),transparent 72%)}
#fcov{--s:min(46vw,220px,30dvh);height:calc(var(--s) + 72px);z-index:1}
.car-in{perspective:900px}
.cs::after{content:"";position:absolute;left:10%;right:10%;bottom:-18px;height:20px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.6),transparent 70%);filter:blur(4px);z-index:-1}
.cbig{box-shadow:0 16px 26px -10px rgba(0,0,0,.65)}
.full .pb,.full .bb{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}
.full .pb.pl{background:var(--ac);border-color:transparent}
.full .bb.act,.full .bb.on{background:rgba(255,255,255,.16);color:var(--ac)}
.ib{width:36px;height:36px;background:transparent}.fh .ib{width:40px}
.fh .ib .i{width:20px;height:20px}
.sm{width:42px;height:42px;border-radius:50%}.sm .i{width:20px;height:20px}
.ib2 .i{width:22px;height:22px}.rm{width:32px;height:32px;background:transparent}
.nav .i{width:20px;height:20px}
.bb{width:64px;height:46px;border-radius:18px}.bb .i{width:22px;height:22px}
.pair .bb{width:66px}.pair .bb:first-child{border-radius:23px 6px 6px 23px}.pair .bb:last-child{border-radius:6px 23px 23px 6px}
.sw{width:44px;height:26px;border-radius:13px;background:var(--glass2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:#34c759}.sw.on::after{transform:translateX(18px)}
</style>
</head>
<body>
<main id="main"></main>

<section class="full" id="full" aria-hidden="true" aria-label="Reproductor">
  <canvas id="fbg" width="24" height="24"></canvas>
  <div class="fh"><button class="ib" id="fclose" aria-label="Cerrar reproductor"></button><span>Ahora en pantalla</span><span class="g"><button class="ib" id="fql" aria-label="Cola de reproducción"></button><button class="ib" id="fmore" aria-label="Más opciones"></button></span></div>
  <div class="mid"><div id="ftint"></div><div id="fcov"></div><div id="fly" class="hidden"></div></div>
  <div class="ft"><span id="ft"></span><small id="fa"></small><small class="oc" id="fo"></small></div>
  <div class="wvw"><canvas id="fwv"></canvas><input type="range" id="frng" min="0" value="0" aria-label="Posición de la canción"></div>
  <div class="tm"><span id="f1">0:00</span><span class="fi" id="ffi"></span><span id="f2">0:00</span></div>
  <div class="pc"><button class="pb" id="fprev" aria-label="Anterior"></button><button class="pb pl" id="fpp" aria-label="Reproducir o pausar"></button><button class="pb" id="fnext" aria-label="Siguiente"></button></div>
  <div class="vol" id="fvol"><span id="vl"></span><input type="range" id="fvl" min="0" max="100" value="100" aria-label="Volumen"><span id="vh"></span></div>
  <div class="bot"><button class="bb" id="flyb" aria-label="Letra"></button><span class="pair"><button class="bb" id="fsh" aria-label="Aleatorio"></button><button class="bb" id="frp" aria-label="Repetir"></button></span><button class="bb" id="fcast" aria-label="Salida de audio"></button></div>
</section>

<footer class="dock">
  <div class="mw"><canvas id="dwv"></canvas><input type="range" id="rng" min="0" value="0" aria-label="Posición de la canción"></div>
  <div class="np"><div id="dcov"></div><div class="rt"><span id="dt"></span><small id="da"></small><small class="oc" id="dout"></small></div><button class="sm" id="pp" aria-label="Reproducir o pausar"></button><button class="ib2" id="next" aria-label="Siguiente"></button></div>
  <nav class="nav">
    <button data-v="home" aria-label="Inicio"></button>
    <button data-v="search" aria-label="Buscar"></button>
    <button data-v="create" aria-label="Crear playlist"></button>
    <button data-v="admin" aria-label="Subir música"></button>
    <button data-v="me" aria-label="Perfil"></button>
  </nav>
