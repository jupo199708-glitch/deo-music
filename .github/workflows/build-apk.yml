          package com.deomusic.app;

          import android.os.Bundle;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(DeoNativePlugin.class);
                  super.onCreate(savedInstanceState);
                  try {
                      WebView w = getBridge().getWebView();
                      if (w != null) w.getSettings().setMediaPlaybackRequiresUserGesture(false);
                  } catch (Exception e) { }
              }

              @Override
              public void onPause() {
                  super.onPause();
                  keepAlive();
              }

              @Override
              public void onStop() {
                  super.onStop();
                  keepAlive();
              }

              /** Evita que Android congele la pagina (y su audio) cuando se apaga la pantalla o se cambia de app. */
              private void keepAlive() {
                  try {
                      if (!DeoNativePlugin.playing || getBridge() == null) return;
                      WebView w = getBridge().getWebView();
                      if (w == null) return;
                      w.onResume();
                      w.resumeTimers();
                  } catch (Exception e) { }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == DeoNativePlugin.REQ) DeoNativePlugin.permResult(grantResults);
              }
          }
