
name: Build DEO Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare app
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json www/manifest.json
          cp logo.png www/logo.png
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@6.2.1 @capacitor/android@6.2.1
          npm install --save-dev @capacitor/cli@6.2.1
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.deomusic.app",
            "appName": "DEO Music",
            "webDir": "www"
          }
          EOF

      - name: Add Android
        run: npx cap add android

      - name: Generate app icons
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os

          logo = Image.open("logo.png").convert("RGBA")

          def make_icon(size, safe_size, path, background=None):
              canvas = Image.new("RGBA", (size, size), background or (0, 0, 0, 0))
              image = logo.copy()
              image.thumbnail((safe_size, safe_size), Image.Resampling.LANCZOS)
              x = (size - image.width) // 2
              y = (size - image.height) // 2
              canvas.alpha_composite(image, (x, y))
              os.makedirs(os.path.dirname(path), exist_ok=True)
              canvas.save(path)

          densities = {
              "mdpi": 1,
              "hdpi": 1.5,
              "xhdpi": 2,
              "xxhdpi": 3,
              "xxxhdpi": 4
          }

          for density, scale in densities.items():
              folder = f"android/app/src/main/res/mipmap-{density}"
              os.makedirs(folder, exist_ok=True)

              legacy = round(48 * scale)
              make_icon(legacy, round(40 * scale),
                        f"{folder}/ic_launcher.png", (255,255,255,255))
              make_icon(legacy, round(40 * scale),
                        f"{folder}/ic_launcher_round.png", (255,255,255,255))

              adaptive = round(108 * scale)
              make_icon(adaptive, round(66 * scale),
                        f"{folder}/ic_launcher_foreground.png")

          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Compile APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: DEO-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
