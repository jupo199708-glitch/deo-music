
name: Build DEO Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare app
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json www/manifest.json
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@6.2.1 @capacitor/android@6.2.1
          npm install --save-dev @capacitor/cli@6.2.1
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.deomusic.app",
            "appName": "DEO Music",
            "webDir": "www"
          }
          EOF

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Compile APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: DEO-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
