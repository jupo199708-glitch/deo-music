<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi música</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#050508;--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.13);--line:rgba(255,255,255,.13);--text:#fff;--muted:rgba(255,255,255,.6);--btn:rgba(255,255,255,.16);--btn-text:#fff;--fill:rgba(255,255,255,.6);--glow:rgba(110,150,255,.22);--glow2:rgba(140,175,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f8ff;--glass:rgba(255,255,255,.7);--glass2:rgba(7,9,15,.08);--line:rgba(7,9,15,.12);--text:#07090f;--muted:rgba(7,9,15,.6);--btn:rgba(7,9,15,.1);--btn-text:#07090f;--fill:rgba(7,9,15,.5)}}
:root[data-theme="dark"]{--bg:#050508}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;position:relative}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
body::before{width:320px;height:320px;background:var(--glow);top:-100px;right:-120px}
body::after{width:280px;height:280px;background:var(--glow2);bottom:120px;left:-110px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,.av:focus-within{outline:2px solid var(--muted);outline-offset:2px}
.i{width:22px;height:22px;flex:none}
#main{flex:1;min-height:0;overflow-y:auto;padding:22px 18px 16px;position:relative;z-index:1}
.prof{display:flex;flex-direction:column;align-items:center;margin-bottom:26px}
.av{position:relative;width:116px;height:116px;border-radius:50%;cursor:pointer;box-shadow:0 10px 40px var(--glow)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--line);background:#fbfbf9}
.cam{position:absolute;right:0;bottom:2px;width:32px;height:32px;border-radius:50%;background:var(--btn);color:var(--btn-text);display:grid;place-items:center}
.cam .i{width:16px;height:16px}
.nm{margin-top:14px;width:100%;max-width:280px;text-align:center;font:inherit;font-size:22px;font-weight:700;color:var(--text);background:none;border:0;border-bottom:1px dashed transparent;padding:4px}
.nm:focus{border-bottom-color:var(--line);outline:0}
h2{font-size:19px;margin:0 0 12px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.top h2{margin:0;flex:1}
.ib{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px;border-radius:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.row.on{background:var(--glass2)}
.rt{flex:1;min-width:0;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.cov{display:grid;place-items:center;flex:none;border-radius:14px;color:rgba(255,255,255,.85);background:linear-gradient(135deg,hsl(var(--h) 72% 52%),hsl(calc(var(--h) + 50) 72% 24%))}
.c64{width:64px;height:64px}.c48{width:48px;height:48px;border-radius:12px}.c44{width:44px;height:44px;border-radius:12px}
.chev{color:var(--muted);margin-right:4px}
.sb{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);margin-bottom:16px}
.sb input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--text);background:none;border:0;outline:0}
.sb input::placeholder{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:15px}
.dock{position:relative;z-index:2;background:var(--glass);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-top:1px solid var(--line);padding:10px 16px 4px}
.np{display:flex;align-items:center;gap:12px}
.np .rt{font-size:15px}
.cast{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.cast.on{background:var(--btn);color:var(--btn-text)}
.seek{display:flex;align-items:center;gap:10px;margin:8px 0 2px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;height:22px;margin:0;background:none;-webkit-appearance:none;appearance:none;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--fill) var(--p),var(--glass2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--text);margin-top:-5px}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--glass2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--fill)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--text)}
.ctl{display:flex;justify-content:center;align-items:center;gap:22px;margin:2px 0 6px}
.ctl .i{width:26px;height:26px}
.pp{width:54px;height:54px;border-radius:50%;background:var(--btn);color:var(--btn-text);display:grid;place-items:center}
.nav{display:flex;border-top:1px solid var(--line);margin:0 -16px;padding-top:4px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px}
.nav button[aria-current="page"]{color:var(--text)}
.sheet{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
.sheet.open{display:flex}
.panel{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 4px}.panel p{margin:0 0 14px;color:var(--muted);font-size:13px}
.dev{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 14px;border-radius:14px;margin-bottom:8px;background:var(--glass);border:1px solid var(--line);text-align:left;font-size:15px}
.dev small{color:var(--muted)}.dev.on{background:var(--btn);color:var(--btn-text)}.dev.on small{color:inherit;opacity:.7}
.toast{position:fixed;left:50%;bottom:calc(250px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;background:var(--btn);color:var(--btn-text);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.cam,.pp,.cast.on,.dev.on{border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav button[aria-current="page"]{background:var(--glass2);border-radius:14px}
.toast{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.row{cursor:pointer}.dev{gap:12px}.dev .rt{flex:1}
.pk{max-height:46vh;overflow-y:auto;margin-bottom:6px}
.full{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px));background:radial-gradient(circle at 50% 28%,hsl(var(--h,220) 70% 32% / .6),transparent 62%),var(--bg);transform:translateY(100%);visibility:hidden;transition:transform .32s ease,visibility .32s}
.full.open{transform:none;visibility:visible}
.fh{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:14px;color:var(--muted)}
.mid{flex:1;display:grid;place-items:center;width:100%}
.cbig{width:min(78vw,340px);aspect-ratio:1;border-radius:28px;box-shadow:0 24px 70px var(--glow)}
.cbig .i{width:30%;height:30%}
.ft{width:100%;text-align:center;margin:14px 0 6px}.ft span{display:block;font-size:24px;font-weight:700}.ft small{display:block;margin-top:4px;font-size:15px;color:var(--muted)}
.full .seek{width:100%}
.ctl.big{position:relative;gap:12px;margin:12px 0 10px}.ctl.big .pp{width:72px;height:72px}.ctl.big .i{width:32px;height:32px}
.fdev{margin:4px 0 0;font-size:13px;color:var(--muted)}
.ctl.big::after{content:"";width:72px;flex:none}
#fcast,#fbt{width:36px;height:36px;background:var(--glass);border:1px solid var(--line)}

#fcast .i,#fbt .i{width:16px;height:16px}
.np{gap:10px}
.np .cast{width:32px;height:32px;background:var(--glass);border:1px solid var(--line)}
.np .cast .i{width:17px;height:17px}
#fcast.on,#fbt.on,.np .cast.on{background:var(--btn);color:var(--btn-text)}
.fh{display:grid;grid-template-columns:1fr auto 1fr}
.fh>span:nth-child(2){justify-self:center}
.fh .g{justify-self:end;display:flex;gap:8px}
.nav button[hidden]{display:none}
.pk2{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--glass);border:1px solid var(--line);margin-bottom:10px;cursor:pointer;font-size:15px}
.pk2 span:not(.ph){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk2 img,.ph{width:48px;height:48px;border-radius:12px;object-fit:cover;flex:none}
.ph{display:grid;place-items:center;background:var(--glass2);color:var(--muted)}
.hint{margin:-6px 0 14px;font-size:13px;color:var(--muted)}
.tgl{display:block;margin:24px auto 0;font-size:12px;color:var(--muted);text-decoration:underline}
.pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;background:var(--glass);border:1px solid var(--line);font-size:13px;margin-top:4px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pill .i{width:16px;height:16px}
.ut{display:flex;justify-content:flex-end;align-items:center;gap:8px;width:100%;margin:2px 0}
.ut .cast{width:32px;height:32px;background:var(--glass);border:1px solid var(--line)}
.ut .cast .i{width:17px;height:17px}
.ut .cast.on{background:var(--btn);color:var(--btn-text)}
#fsh,#frp{width:30px;height:30px}
#fsh .i,#frp .i{width:18px;height:18px}
.sw{display:flex;align-items:center;gap:7px;height:32px;padding:0 11px 0 8px;border-radius:16px;background:var(--glass);border:1px solid var(--line);font-size:12px;color:var(--text)}
.trk{position:relative;width:28px;height:16px;border-radius:8px;background:var(--glass2)}
.trk i{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--muted);transition:transform .2s}
.sw[aria-checked="true"] .trk{background:var(--btn)}
.sw[aria-checked="true"] .trk i{transform:translateX(12px);background:var(--text)}
@media (prefers-reduced-motion: reduce){.trk i{transition:none}}
#fcov{position:relative;width:calc(100% + 44px);height:calc(var(--s) + 48px);--s:min(56vw,260px);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.car-in{position:absolute;inset:0}
.cs{position:absolute;top:24px;left:calc(50% - var(--s) / 2);width:var(--s);height:var(--s);will-change:transform,opacity}


.cbig{width:100%;height:100%;aspect-ratio:auto}
@media (prefers-reduced-motion: reduce){.full{transition:none}}
.sin{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.hidden{display:none}
.gate{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);overflow-y:auto}
.gate.hidden{display:none}
.gcard{width:100%;max-width:380px;background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:28px 22px;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.glogo{width:96px;height:96px;border-radius:26px;overflow:hidden;margin:0 auto 14px;background:#fbfbf9;box-shadow:0 10px 40px var(--glow)}
.glogo img{width:100%;height:100%;object-fit:cover}
.gcard h1{font-size:23px;text-align:center;margin:0 0 4px}
.gs{text-align:center;color:var(--muted);font-size:14px;margin:0 0 18px}
.gtabs{display:flex;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.gtabs button{flex:1;padding:10px;border-radius:10px;font-size:14px;color:var(--muted);border:1px solid transparent}
.gtabs button[aria-selected="true"]{background:var(--btn);color:var(--btn-text);border-color:var(--line)}
.gcard label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
.gcard .sin{margin-bottom:0}
.gbtn{width:100%;margin-top:18px;padding:14px;border-radius:14px;background:var(--btn);color:var(--btn-text);border:1px solid var(--line);font-size:16px;font-weight:600}
.gbtn:disabled{opacity:.6}
.gmsg{min-height:20px;margin:12px 0 0;font-size:14px;text-align:center}.gmsg.err{color:#ff8b98}.gmsg.ok{color:#6ee7b7}
.dst{display:flex;gap:8px;margin-bottom:10px}.dst .dev{margin:0;justify-content:center}
</style>
</head>
<body>
<main id="main"></main>

<section class="full" id="full" aria-hidden="true" aria-label="Reproductor">
  <div class="fh"><button class="ib" id="fclose" aria-label="Cerrar reproductor"></button><span>Reproduciendo</span><span class="g"><button class="cast" id="fcast" aria-label="Emitir por Wi-Fi"></button><button class="cast" id="fbt" aria-label="Conectar por Bluetooth"></button></span></div>
  <div class="mid"><div id="fcov"></div></div>
  <div class="ft"><span id="ft"></span><small id="fa"></small></div>
  <div class="ut"><button class="sw" id="fnet" role="switch" aria-checked="true" aria-label="Online u offline"></button><button class="cast" id="ftm" aria-label="Temporizador"></button><button class="cast" id="fql" aria-label="Ver la lista de reproducción"></button></div>
  <div class="seek"><span id="f1">0:00</span><input type="range" id="frng" min="0" value="0" aria-label="Posición de la canción"><span id="f2">0:00</span></div>
  <div class="ctl big">
    <button class="cast" id="fsh" aria-label="Aleatorio"></button>
    <button class="cast" id="frp" aria-label="Repetir"></button>
    <button id="fprev" aria-label="Anterior"></button>
    <button class="pp" id="fpp" aria-label="Reproducir o pausar"></button>
    <button id="fnext" aria-label="Siguiente"></button>
    
  </div>
  <p class="fdev" id="fdev"></p>
</section>

<footer class="dock">
  <div class="np">
    <div id="dcov"></div>
    <div class="rt"><span id="dt"></span><small id="da"></small></div>
    <button class="cast" id="cast" aria-label="Emitir por Wi-Fi"></button>
    <button class="cast" id="bt" aria-label="Conectar por Bluetooth"></button>
  </div>
  <div class="seek"><span id="t1">0:00</span><input type="range" id="rng" min="0" value="0" aria-label="Posición de la canción"><span id="t2">0:00</span></div>
  <div class="ctl">
    <button id="prev" aria-label="Anterior"></button>
    <button class="pp" id="pp" aria-label="Reproducir o pausar"></button>
    <button id="next" aria-label="Siguiente"></button>
  </div>
  <nav class="nav">
    <button data-v="home" aria-label="Inicio"></button>
    <button data-v="search" aria-label="Buscar"></button>
    <button data-v="create" aria-label="Crear playlist"></button>
    <button data-v="admin" aria-label="Subir música"></button>
  </nav>
</footer>

<div class="sheet" id="sheet"><div class="panel">
  
  <div id="devs"></div>
</div></div>
<div class="sheet" id="sheet2"><div class="panel" id="p2"></div></div>
<div class="gate hidden" id="gate"><div class="gcard">
  <div class="glogo"><img id="glg" alt="Logo"></div>
  <h1 id="gt">Bienvenido</h1><p class="gs" id="gsub">Ingresa para escuchar tu música</p>
  <div class="gtabs"><button id="gin" aria-selected="true">Ingresar</button><button id="gup" aria-selected="false">Registrarse</button></div>
  <label for="gem">Correo</label><input class="sin" id="gem" type="email" autocomplete="email" inputmode="email" placeholder="tu@correo.com">
  <label for="gpw">Clave</label><input class="sin" id="gpw" type="password" autocomplete="current-password" placeholder="Mínimo 6 caracteres">
  <div id="gcw" class="hidden"><label for="gpw2">Repite la clave</label><input class="sin" id="gpw2" type="password" autocomplete="new-password" placeholder="Repite tu clave"></div>
  <button class="gbtn" id="ggo">Ingresar</button><p class="gmsg" id="gmsg" role="status"></p>
</div></div>
<div class="toast" id="toast" role="status"></div>
